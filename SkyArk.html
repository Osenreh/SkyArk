<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Небесный Ковчег</title>
<style>
:root{
  --bg-0:#070a12;--bg-1:#0d1220;--panel:rgba(16,22,38,.82);--panel-solid:#131a2b;
  --line:#243149;--line-soft:#1a2338;--text:#dfe7f5;--text-dim:#8d9cb8;--text-mute:#61708c;
  --accent:#5b8cff;--accent-2:#7fe3d4;--warn:#ffb457;--bad:#ff6b6b;--good:#5fd68a;
  --r:12px;--shadow:0 18px 48px rgba(0,0,0,.55);
  --font:'Segoe UI',system-ui,-apple-system,'Inter','Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-0);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
.ui > *{pointer-events:auto}
.modal-layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:60}
.modal-layer.open{pointer-events:auto}
.toasts{position:absolute;right:18px;bottom:88px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;z-index:80}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(9,13,23,.92),rgba(9,13,23,.55));border-bottom:1px solid var(--line-soft);backdrop-filter:blur(14px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding-right:14px;margin-right:4px;border-right:1px solid var(--line-soft)}
.brand .mark{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#8f6bff);box-shadow:0 0 18px rgba(91,140,255,.5);display:grid;place-items:center;font-size:13px;color:#fff}
.brand .name{font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .turn{font-size:11px;color:var(--text-mute);font-family:var(--mono)}
.res{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;transition:background .2s,border-color .2s}
.res:hover{background:rgba(255,255,255,.06)}
.res .ic{font-size:13px;opacity:.9}
.res .v{font-weight:600}
.res .d{font-size:10.5px;font-weight:600}
.res .d.up{color:var(--good)}
.res .d.down{color:var(--bad)}
.res.low{border-color:rgba(255,107,107,.45)}
.res.low .v{color:var(--bad)}
.spacer{flex:1}
.btn{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;transition:background .16s,border-color .16s,transform .1s,color .16s;white-space:nowrap}
.btn:hover{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.5)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,rgba(91,140,255,.28),rgba(91,140,255,.16));border-color:rgba(91,140,255,.6);color:#dfe9ff}
.btn.primary:hover{background:linear-gradient(180deg,rgba(91,140,255,.42),rgba(91,140,255,.26))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--text)}
.btn.danger{border-color:rgba(255,107,107,.4);color:#ffc9c9}
.btn.danger:hover{background:rgba(255,107,107,.16)}
.btn:disabled{opacity:.36;cursor:not-allowed;transform:none}
.btn.on{background:rgba(91,140,255,.22);border-color:rgba(91,140,255,.6)}
.btn .k{font-family:var(--mono);font-size:10px;opacity:.5;margin-left:6px}
.dock{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(0deg,rgba(9,13,23,.94),rgba(9,13,23,.6));border-top:1px solid var(--line-soft);backdrop-filter:blur(14px);flex-wrap:wrap}
.side{position:absolute;top:56px;bottom:60px;width:340px;background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:slideIn .22s ease}
.side.right{right:14px}
.side.left{left:14px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.side-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.side-head h3{font-size:13.5px;font-weight:650;flex:1}
.side-head .sub{font-size:11px;color:var(--text-mute);font-family:var(--mono)}
.side-body{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.side-foot{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side-body::-webkit-scrollbar,.modal-card::-webkit-scrollbar{width:9px}
.side-body::-webkit-scrollbar-thumb,.modal-card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:9px;border:2px solid transparent;background-clip:content-box}
.card{background:rgba(255,255,255,.032);border:1px solid var(--line-soft);border-radius:10px;padding:11px;transition:border-color .16s,background .16s}
.card.click{cursor:pointer}
.card.click:hover{background:rgba(91,140,255,.08);border-color:rgba(91,140,255,.4)}
.card.locked{opacity:.45}
.card.sel{border-color:var(--accent);background:rgba(91,140,255,.12)}
.card-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.card-top .ic{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.28)}
.card-top .ttl{flex:1;font-size:12.5px;font-weight:600}
.card-top .lvl{font-family:var(--mono);font-size:10.5px;color:var(--text-mute)}
.card p{font-size:11.5px;line-height:1.5;color:var(--text-dim)}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.stat{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft);color:var(--text-dim)}
.stat.pos{color:var(--good);border-color:rgba(95,214,138,.28);background:rgba(95,214,138,.09)}
.stat.neg{color:var(--bad);border-color:rgba(255,107,107,.28);background:rgba(255,107,107,.09)}
.stat.key{color:var(--accent-2);border-color:rgba(127,227,212,.28);background:rgba(127,227,212,.09)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#8f6bff);transition:width .35s}
.bar.g > i{background:linear-gradient(90deg,#3fae6a,var(--good))}
.bar.w > i{background:linear-gradient(90deg,#c98a2e,var(--warn))}
.bar.b > i{background:linear-gradient(90deg,#b23b3b,var(--bad))}
.modal-layer.open::before{content:'';position:absolute;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(4px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;width:min(680px,92vw);max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#151d30,#101728);border:1px solid var(--line);border-radius:16px;box-shadow:0 28px 80px rgba(0,0,0,.7);animation:pop .24s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal-card header{padding:18px 22px 14px;border-bottom:1px solid var(--line-soft)}
.modal-card header .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-2);padding:3px 8px;border-radius:5px;background:rgba(127,227,212,.1);border:1px solid rgba(127,227,212,.24);margin-bottom:9px}
.modal-card header h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.modal-card .body{padding:18px 22px;font-size:13.5px;line-height:1.66;color:var(--text-dim)}
.modal-card .body p + p{margin-top:10px}
.modal-card .body b{color:var(--text);font-weight:600}
.modal-card .body em{color:var(--accent-2);font-style:normal}
.modal-card footer{padding:14px 22px 20px;display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;color:var(--text);font-family:var(--font);font-size:13px;transition:background .16s,border-color .16s,transform .1s}
.opt:hover{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.55);transform:translateX(2px)}
.opt:disabled{opacity:.4;cursor:not-allowed;transform:none}
.opt .lbl{font-weight:600;display:block}
.opt .hint{display:block;margin-top:3px;font-size:11.5px;color:var(--text-mute);font-family:var(--mono)}
.squad-row{display:flex;align-items:center;gap:9px;margin-top:8px}
.unit{flex:1;text-align:center;padding:7px 4px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--line-soft)}
.unit .role{font-size:10.5px;color:var(--text-dim);margin-bottom:4px}
.unit .hp{font-family:var(--mono);font-size:11px}
.unit.dead{opacity:.35;filter:grayscale(1)}
.logline{font-size:11.5px;line-height:1.55;color:var(--text-dim);padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.028);border-left:2px solid var(--line)}
.logline.good{border-left-color:var(--good)}
.logline.bad{border-left-color:var(--bad)}
.logline.info{border-left-color:var(--accent)}
.logline.warn{border-left-color:var(--warn)}
.toast{padding:9px 14px;border-radius:10px;background:var(--panel-solid);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;animation:toastIn .22s ease;max-width:340px}
.toast.good{border-color:rgba(95,214,138,.45)}
.toast.bad{border-color:rgba(255,107,107,.45)}
.toast.warn{border-color:rgba(255,180,87,.45)}
@keyframes toastIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(22px);transition:all .3s}
.title-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:50}
.title-screen h1{font-size:clamp(38px,7vw,76px);font-weight:200;letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#7f9bd6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(91,140,255,.35)}
.title-screen .tagline{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--text-mute);margin-bottom:38px}
.title-menu{display:flex;flex-direction:column;gap:10px;width:280px}
.title-menu .btn{padding:12px;font-size:13.5px;text-align:center}
.title-foot{position:absolute;bottom:24px;font-size:11px;color:var(--text-mute);font-family:var(--mono);letter-spacing:.05em}
.hint{font-size:11.5px;color:var(--text-mute);line-height:1.55}
.divider{height:1px;background:var(--line-soft);margin:4px 0}
.row{display:flex;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line-soft);color:var(--text-mute)}
.pill.a{color:var(--accent);border-color:rgba(91,140,255,.35);background:rgba(91,140,255,.1)}
.pill.g{color:var(--good);border-color:rgba(95,214,138,.35);background:rgba(95,214,138,.1)}
.pill.r{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.1)}
.pill.w{color:var(--warn);border-color:rgba(255,180,87,.35);background:rgba(255,180,87,.1)}
@media (max-width:820px){
  .side{width:calc(100vw - 28px);left:14px;right:14px}
  .side.right{left:14px;right:14px}
  .res{padding:4px 8px;font-size:11.5px}
  .brand .name{display:none}
}
</style>

<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui" class="ui"></div>
  <div id="modal" class="modal-layer"></div>
  <div id="toasts" class="toasts"></div>
</div>

<script>
/* =====================================================================
   ОБЩИЕ КОНСТАНТЫ
   ===================================================================== */
const ICON = { food: '❦', materials: '⚙', energy: '⚡', crystals: '◈', research: '⌬' };
const BIOME_ICON = { ruins: '⌗', forest: '❦', wastes: '≋', ghostcity: '⌂', crystal: '◈', lake: '≈' };

/* =====================================================================
   js/core/rng.js
   ===================================================================== */
function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length];
const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const randFloat = (rng, a, b) => a + rng() * (b - a);
const chance = (rng, p) => rng() < p;
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function weighted(rng, items) {
  const total = items.reduce((s, it) => s + (it.weight || 1), 0);
  let r = rng() * total;
  for (const it of items) {
    r -= it.weight || 1;
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

/* =====================================================================
   js/core/bus.js
   ===================================================================== */
class Bus {
  constructor() { this.map = new Map(); }
  on(name, fn) {
    if (!this.map.has(name)) this.map.set(name, new Set());
    this.map.get(name).add(fn);
    return () => this.off(name, fn);
  }
  off(name, fn) { this.map.get(name)?.delete(fn); }
  emit(name, payload) {
    const set = this.map.get(name);
    if (!set) return;
    for (const fn of [...set]) {
      try { fn(payload); } catch (err) { console.error(`[bus] ${name}:`, err); }
    }
  }
}

/* =====================================================================
   js/core/audio.js
   ===================================================================== */
class AudioEngine {
  constructor() {
    this.ctx = null; this.master = null; this.sfxGain = null; this.musicGain = null;
    this.started = false; this.drone = null;
    this.sfxOn = true; this.musicOn = true;
  }
  init() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = this.sfxOn ? 0.5 : 0;
    this.sfxGain.connect(this.master);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = this.musicOn ? 0.16 : 0;
    this.musicGain.connect(this.master);
    this.started = true;
    this.startDrone();
  }
  setSfx(on) { this.sfxOn = on; if (this.sfxGain) this.sfxGain.gain.value = on ? 0.5 : 0; }
  setMusic(on) { this.musicOn = on; if (this.musicGain) this.musicGain.gain.value = on ? 0.16 : 0; }
  tone({ freq = 440, dur = 0.14, type = 'sine', gain = 0.3, detune = 0, slide = 0 }) {
    if (!this.started || !this.sfxOn) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    if (detune) osc.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  noise({ dur = 0.18, gain = 0.25, lp = 1600 } = {}) {
    if (!this.started || !this.sfxOn) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = lp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter); filter.connect(g); g.connect(this.sfxGain);
    src.start(t);
  }
  click()   { this.tone({ freq: 620, dur: 0.05, type: 'triangle', gain: 0.16 }); }
  hover()   { this.tone({ freq: 880, dur: 0.03, type: 'sine', gain: 0.05 }); }
  confirm() { this.tone({ freq: 520, dur: 0.09, type: 'triangle', gain: 0.2 });
              setTimeout(() => this.tone({ freq: 780, dur: 0.13, type: 'triangle', gain: 0.18 }), 70); }
  deny()    { this.tone({ freq: 200, dur: 0.16, type: 'sawtooth', gain: 0.13, slide: -70 }); }
  build()   { this.noise({ dur: 0.34, gain: 0.2, lp: 900 });
              setTimeout(() => this.tone({ freq: 340, dur: 0.24, type: 'sine', gain: 0.2, slide: 260 }), 120); }
  coin()    { this.tone({ freq: 1180, dur: 0.07, type: 'square', gain: 0.11 });
              setTimeout(() => this.tone({ freq: 1560, dur: 0.1, type: 'square', gain: 0.09 }), 60); }
  event()   { this.tone({ freq: 300, dur: 0.5, type: 'sine', gain: 0.2, slide: 180 }); }
  alarm()   { this.tone({ freq: 420, dur: 0.22, type: 'square', gain: 0.16, slide: -140 });
              setTimeout(() => this.tone({ freq: 420, dur: 0.22, type: 'square', gain: 0.16, slide: -140 }), 280); }
  hit()     { this.noise({ dur: 0.12, gain: 0.3, lp: 2400 });
              this.tone({ freq: 160, dur: 0.1, type: 'sawtooth', gain: 0.15 }); }
  levelUp() { [523, 659, 784, 1046].forEach((f, i) =>
                setTimeout(() => this.tone({ freq: f, dur: 0.16, type: 'triangle', gain: 0.16 }), i * 85)); }
  travel()  { this.tone({ freq: 180, dur: 1.1, type: 'sine', gain: 0.16, slide: 140 }); }
  startDrone() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.gain.value = 0.5;
    g.connect(this.musicGain);
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 520; filter.Q.value = 3;
    filter.connect(g);
    const freqs = [55, 82.5, 110, 164.8];
    const oscs = freqs.map((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (i - 1.5) * 7;
      const og = this.ctx.createGain();
      og.gain.value = 0.24 / (i + 1);
      const lfo = this.ctx.createOscillator();
      lfo.frequency.value = 0.045 + i * 0.017;
      const lg = this.ctx.createGain();
      lg.gain.value = 0.1 / (i + 1);
      lfo.connect(lg); lg.connect(og.gain);
      osc.connect(og); og.connect(filter);
      osc.start(t); lfo.start(t);
      return osc;
    });
    this.drone = { oscs, g };
  }
  duck(on) {
    if (!this.musicGain) return;
    const target = on ? 0.05 : (this.musicOn ? 0.16 : 0);
    this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicGain.gain.linearRampToValueAtTime(target, this.ctx.currentTime + 0.6);
  }
}

/* =====================================================================
   js/render/draw.js
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => (b - a === 0 ? 0 : (v - a) / (b - a));
const ease = (t) => t * t * (3 - 2 * t);
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);

const PALETTES = [
  { top: '#05070f', mid: '#0b1122', bot: '#131c33', cloud: '#2a3550', sun: '#9fb8ff', star: 1 },
  { top: '#131a35', mid: '#3a3560', bot: '#8a5c72', cloud: '#c08a92', sun: '#ffd3a8', star: 0.35 },
  { top: '#2a4a7f', mid: '#4f7bb5', bot: '#9dc0dd', cloud: '#ffffff', sun: '#fff6dd', star: 0 },
  { top: '#181d3d', mid: '#5a3a63', bot: '#c76b52', cloud: '#e8a07a', sun: '#ffcf8a', star: 0.2 },
];
function paletteFor(t) {
  const p = (t + 0.125) % 1;
  const idx = p * 4;
  const i0 = Math.floor(idx) % 4;
  const i1 = (i0 + 1) % 4;
  const f = idx - Math.floor(idx);
  const a = PALETTES[i0], b = PALETTES[i1];
  return {
    top: mixHex(a.top, b.top, f),
    mid: mixHex(a.mid, b.mid, f),
    bot: mixHex(a.bot, b.bot, f),
    cloud: mixHex(a.cloud, b.cloud, f),
    sun: mixHex(a.sun, b.sun, f),
    star: lerp(a.star, b.star, f),
  };
}
function makeCloud(rng, w, h, layer) {
  const puffs = [];
  const n = 5 + Math.floor(rng() * 6);
  const spread = 60 + layer * 70;
  for (let i = 0; i < n; i++) {
    puffs.push({
      dx: (rng() - 0.5) * spread * 2,
      dy: (rng() - 0.5) * spread * 0.42,
      r: (0.35 + rng() * 0.65) * (34 + layer * 42),
    });
  }
  return {
    x: rng() * w * 1.4 - w * 0.2,
    y: h * (0.22 + rng() * 0.66),
    speed: (0.6 + layer * 1.5) * (0.4 + rng() * 0.8),
    alpha: 0.05 + layer * 0.075 + rng() * 0.05,
    puffs, layer,
  };
}
class SkyRenderer {
  constructor() {
    this.stars = []; this.clouds = []; this.w = 0; this.h = 0;
    this.time = 0; this.timeScale = 1; this.ready = false;
    this.shootingStar = null; this.nextShooting = 6 + Math.random() * 12;
  }
  resize(w, h) {
    const rebuild = !this.ready || Math.abs(this.w - w) > 400;
    this.w = w; this.h = h;
    if (!rebuild) return;
    this.stars = [];
    const count = Math.round((w * h) / 5200);
    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * w, y: Math.random() * h * 0.85,
        r: Math.random() * 1.35 + 0.25,
        tw: Math.random() * Math.PI * 2,
        tws: 0.4 + Math.random() * 1.8,
      });
    }
    this.clouds = [];
    for (let layer = 0; layer < 4; layer++) {
      const n = 5 + layer * 2;
      for (let i = 0; i < n; i++) this.clouds.push(makeCloud(Math.random, w, h, layer));
    }
    this.clouds.sort((a, b) => a.layer - b.layer);
    this.ready = true;
  }
  update(dt) {
    this.time = (this.time + dt * this.timeScale * 0.0042) % 1;
    for (const c of this.clouds) {
      c.x += c.speed * dt * (8 + c.layer * 10);
      if (c.x - 400 > this.w) c.x = -420;
    }
    const pal = paletteFor(this.time);
    this.nextShooting -= dt;
    if (!this.shootingStar && pal.star > 0.5 && this.nextShooting <= 0) {
      this.shootingStar = {
        x: Math.random() * this.w * 0.8, y: Math.random() * this.h * 0.4,
        vx: 320 + Math.random() * 260, vy: 130 + Math.random() * 120,
        life: 0, max: 0.85,
      };
      this.nextShooting = 9 + Math.random() * 18;
    }
    if (this.shootingStar) {
      const s = this.shootingStar;
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.life > s.max) this.shootingStar = null;
    }
  }
  get palette() { return paletteFor(this.time); }
  draw(ctx, w, h) {
    const pal = paletteFor(this.time);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, pal.top);
    g.addColorStop(0.52, pal.mid);
    g.addColorStop(1, pal.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    this.drawStars(ctx, w, h, pal);
    this.drawSun(ctx, w, h, pal);
    this.drawShootingStar(ctx);
  }
  drawStars(ctx, w, h, pal) {
    if (pal.star <= 0.02) return;
    const t = performance.now() / 1000;
    ctx.save();
    for (const s of this.stars) {
      const tw = 0.55 + 0.45 * Math.sin(t * s.tws + s.tw);
      ctx.globalAlpha = pal.star * tw * 0.95;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

        ctx.globalAlpha = pal.star * tw * 0.2;

        ctx.arc(s.x, s.y, s.r * 3.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  drawSun(ctx, w, h, pal) {
    const a = (this.time - 0.25) * Math.PI * 2;
    const cx = w * 0.5 + Math.cos(a - Math.PI / 2) * w * 0.34;
    const cy = h * 0.62 + Math.sin(a - Math.PI / 2) * h * 0.52;
    const isMoon = this.time > 0.62 || this.time < 0.12;
    const r = isMoon ? 26 : 44;
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 8);
    halo.addColorStop(0, hexA('#ffffff', isMoon ? 0.16 : 0.4));
    halo.addColorStop(0.25, hexA(pal.sun, isMoon ? 0.07 : 0.16));
    halo.addColorStop(1, hexA(pal.sun, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.shadowColor = pal.sun;
    ctx.shadowBlur = isMoon ? 30 : 60;
    ctx.fillStyle = isMoon ? '#e8eeff' : pal.sun;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (isMoon) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#8f9dc4';
      const craters = [[-0.3, -0.2, 0.22], [0.28, 0.12, 0.17], [-0.1, 0.38, 0.13], [0.35, -0.35, 0.1]];
      for (const [dx, dy, cr] of craters) {
        ctx.beginPath();
        ctx.arc(cx + dx * r, cy + dy * r, cr * r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
  drawShootingStar(ctx) {
    const s = this.shootingStar;
    if (!s) return;
    const k = 1 - s.life / s.max;
    const len = 120;
    const nx = s.vx, ny = s.vy;
    const m = Math.hypot(nx, ny) || 1;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - (nx / m) * len, s.y - (ny / m) * len);
    g.addColorStop(0, `rgba(255,255,255,${0.9 * k})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - (nx / m) * len, s.y - (ny / m) * len);
    ctx.stroke();
  }
  drawClouds(ctx, w, h, { from = 0, to = 4, alphaMul = 1, yOffset = 0 } = {}) {
    const pal = paletteFor(this.time);
    for (const c of this.clouds) {
      if (c.layer < from || c.layer >= to) continue;
      ctx.save();
      ctx.globalAlpha = c.alpha * alphaMul;
      const col = pal.cloud;
      for (const p of c.puffs) {
        const g = ctx.createRadialGradient(
          c.x + p.dx, c.y + p.dy + yOffset, 0,
          c.x + p.dx, c.y + p.dy + yOffset, p.r
        );
        g.addColorStop(0, hexA(col, 0.95));
        g.addColorStop(0.55, hexA(col, 0.4));
        g.addColorStop(1, hexA(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x + p.dx, c.y + p.dy + yOffset, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
  drawCloudSea(ctx, w, h, t) {
    const pal = paletteFor(this.time);
    const baseY = h * 0.86;
    for (let layer = 0; layer < 3; layer++) {
      const yOff = layer * 34;
      const speed = 12 + layer * 22;
      const alpha = 0.16 + layer * 0.13;
      ctx.beginPath();
      ctx.moveTo(-10, h + 10);
      for (let x = -10; x <= w + 10; x += 14) {
        const n = noise1((x + t * speed) * 0.004, layer * 31) * 0.6

        const y = baseY + yOff - n * 46;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w + 10, h + 10);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, baseY - 70 + yOff, 0, h);
      g.addColorStop(0, hexA(pal.cloud, alpha));
      g.addColorStop(1, hexA(pal.cloud, alpha * 1.7));
      ctx.fillStyle = g;
      ctx.fill();
    }
  }
}

const BIOME_KEYS = Object.keys(BIOMES);
function generateWorld(seed) {
  const rng = makeRng(seed);
  const COLS = 7, ROWS = 5;
  const SPACING_X = 210, SPACING_Y = 190, JITTER = 58;
  const nodes = [];
  let idCounter = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const offset = (r % 2) * (SPACING_X / 2);
      const x = c * SPACING_X + offset + (rng() - 0.5) * JITTER * 2 + 160;
      const y = r * SPACING_Y + (rng() - 0.5) * JITTER * 2 + 140;
      const cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2;
      const distN = Math.hypot(c - cx, r - cy) / Math.hypot(cx, cy);
      const dangerBias = distN;
      let biome;
      if (dangerBias > 0.72) biome = chance(rng, 0.4) ? 'crystal' : pick(rng, ['wastes','ghostcity','lake']);
      else if (dangerBias > 0.4) biome = pick(rng, ['ghostcity','wastes','forest','lake','ruins']);
      else biome = pick(rng, ['ruins','forest','forest','ruins','lake']);
      const def = BIOMES[biome];
      const richness = randFloat(rng, 0.75, 1.35) * (1 + dangerBias * 0.5);
      nodes.push({
        id: 'n' + (idCounter++), x, y, col: c, row: r, biome,
        danger: Math.min(3, def.danger + (dangerBias > 0.8 && chance(rng, 0.4) ? 1 : 0)),
        richness: +richness.toFixed(2),
        name: pick(rng, def.names),
        edges: [], visited: false, revealed: false, cleared: 0,
      });
    }
  }
  for (const n of nodes) {
    const others = nodes.filter(o => o !== n).map(o => ({ o, d: Math.hypot(o.x - n.x, o.y - n.y) })).sort((a, b) => a.d - b.d);
    const maxLinks = 3;
    for (const { o, d } of others) {
      if (n.edges.length >= maxLinks) break;
      if (d > 300) break;
      if (n.edges.includes(o.id)) continue;
      n.edges.push(o.id);
      o.edges.push(n.id);
    }
  }
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const seen = new Set();
  const components = [];
  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const comp = [];
    const stack = [n];
    seen.add(n.id);
    while (stack.length) {
      const cur = stack.pop();
      comp.push(cur);
      for (const e of cur.edges) { if (!seen.has(e)) { seen.add(e); stack.push(byId[e]); } }
    }
    components.push(comp);
  }
  for (let i = 1; i < components.length; i++) {
    let best = null;
    for (const a of components[i]) for (const b of components[i - 1]) {
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (!best || d < best.d) best = { a, b, d };
    }
    if (best) { best.a.edges.push(best.b.id); best.b.edges.push(best.a.id); }
  }
  let start = nodes[0], bestD = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - 1010, n.y - 620);
    if (d < bestD) { bestD = d; start = n; }
  }
  start.biome = 'ruins';
  start.name = 'Точка Ноль';
  start.danger = 1;
  start.revealed = true;
  start.visited = true;
  for (const e of start.edges) byId[e].revealed = true;
  return { nodes, startId: start.id, width: COLS * SPACING_X + 400, height: ROWS * SPACING_Y + 320 };
}
function nodeById(world, id) { return world.nodes.find(n => n.id === id); }
function travelTurns(a, b) { return Math.max(1, Math.round(Math.hypot(a.x - b.x, a.y - b.y) / 210)); }

function findModule(state, type) { return state.city.modules.find(m => m.type === type); }
function moduleLevel(state, type) { return findModule(state, type)?.level || 0; }
function popCapacity(state) {
  let cap = 0;
  for (const m of state.city.modules) {
    const def = BUILDINGS[m.type];
    if (def?.popCap) cap += def.popCap(m.level);
  }
  cap += techEffect(state, 'popCap', 0);
  return Math.max(4, cap);
}
function foodUpkeep(state) { return Math.round(state.population.current * 0.25 * 10) / 10; }
function computeEconomy(state) {
  const produce = { food: 0, materials: 0, energy: 0, crystals: 0 };
  const upkeep = { food: 0, materials: 0, energy: 0, crystals: 0 };
  const notes = [];
  for (const m of state.city.modules) {
    const def = BUILDINGS[m.type];
    if (!def) continue;
    const p = def.produce?.(m.level) || {};
    for (const [k, v] of Object.entries(p)) produce[k] = (produce[k] || 0) + v;
    const u = def.upkeep?.(m.level) || {};
    for (const [k, v] of Object.entries(u)) upkeep[k] = (upkeep[k] || 0) + v;
  }
  const passiveMat = techEffect(state, 'passiveMaterials', 0);
  if (passiveMat) { produce.materials += passiveMat; notes.push(`Дроны-сборщики: +${passiveMat} ⚙`); }
  const prodMul = techMul(state, 'prodMul');
  if (prodMul !== 1) {
    produce.materials = Math.round(produce.materials * prodMul);
    produce.energy = Math.round(produce.energy * prodMul);
    notes.push(`Небесная кузня: производство ×${prodMul}`);
  }
  upkeep.food += foodUpkeep(state);
  const net = {
    food: +(produce.food - upkeep.food).toFixed(1),
    materials: +(produce.materials - upkeep.materials).toFixed(1),
    energy: +(produce.energy - upkeep.energy).toFixed(1),
    crystals: +(produce.crystals - upkeep.crystals).toFixed(1),
  };
  if (net.energy < 0) notes.push('⚠ Дефицит энергии — часть модулей работает вполсилы');
  return { produce, upkeep, net, notes };
}
function buildCheck(state, type) {
  const existing = findModule(state, type);
  const level = existing?.level || 0;
  const def = BUILDINGS[type];
  if (!def) return { ok: false, reason: 'Неизвестный модуль' };
  if (level >= def.max) return { ok: false, reason: 'Максимальный уровень' };
  const cost = nextCost(type, level);
  if (!canAfford(state.resources, cost)) return { ok: false, reason: 'Недостаточно ресурсов', cost };
  if (cost.energy && state.resources.energy < cost.energy) return { ok: false, reason: 'Не хватает энергии', cost };
  return { ok: true, cost, level, isNew: level === 0 };
}
function build(state, type) {
  const check = buildCheck(state, type);
  if (!check.ok) return check;
  pay(state.resources, check.cost);
  const existing = findModule(state, type);
  if (existing) existing.level++;
  else state.city.modules.push({ id: 'm' + (++state.counters.m), type, level: 1 });
  if (type === 'habitat') state.population.capacity = popCapacity(state);
  return { ok: true, level: (existing?.level || 1) };
}
function damageHull(state, amount) {
  const guard = techEffect(state, 'hullGuard', 0);
  const mul = guard ? (1 - guard) : 1;
  const real = Math.max(1, Math.round(amount * mul));
  state.city.hull = Math.max(0, state.city.hull - real);
  return real;
}
function repairHull(state, amount) { state.city.hull = Math.min(state.city.hullMax, state.city.hull + amount); }

  }));
}
function researchTech(state, id) {
  const def = TECH[id];
  if (!def) return { ok: false, reason: 'Неизвестная технология' };
  if (hasTech(state, id)) return { ok: false, reason: 'Уже изучено' };
  if (state.resources.research < def.cost) return { ok: false, reason: 'Недостаточно очков науки' };
  state.resources.research -= def.cost;
  state.city.tech.push(id);
  if (def.effects.instantPop) {
    state.population.current = Math.min(popCapacity(state), state.population.current + def.effects.instantPop);

}
